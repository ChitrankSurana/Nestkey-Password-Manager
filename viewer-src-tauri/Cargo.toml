[package]
name = "nestkey-viewer"
version = "2.9.0"
description = "Nestkey Password Manager - Read-only Viewer"
authors = ["you"]
edition = "2021"

[lib]
name = "nestkey_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nestkey-core = { path = "../core" }
openssl-sys = "0.9"
dirs = "5"
tokio = { version = "1", features = ["time"] }
zeroize = { version = "1.7", features = ["serde"] }
tauri-plugin-clipboard-manager = "2"
