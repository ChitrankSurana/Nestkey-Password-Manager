[package]
name = "pwmgr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive", "serde"] }
thiserror = "1.0"
subtle = "2.5"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zxcvbn = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }
signature = "2"

[dev-dependencies]
tempfile = "3.10"
