name: CI

on:
  pull_request:
  push:
    branches: [main]

# Windows-only app (see docs/KNOWN_LIMITATIONS.md): build and test on the real target.
# windows-latest ships Rust, Node, MSVC Build Tools and Strawberry Perl (needed to compile
# the vendored OpenSSL behind SQLCipher).
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      # Must run before cargo: the Tauri crates embed ../dist at compile time.
      - name: Frontend type-check and build
        run: npm run build

      - name: Rust tests (whole workspace)
        run: cargo test --workspace
